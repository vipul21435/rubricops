[project]
name = "rubricops"
version = "0.1.0"
description = "Expert review operations: versioned weighted rubrics, exact rubric scoring, a primary -> QA -> adjudication review pipeline with a hash-chained audit log, review-queue assignment with SLAs and reasoned QA sampling, and inter-rater agreement with bootstrap confidence intervals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.14",
    "numpy>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.36",
    "typer>=0.12",
]

[project.scripts]
rubricops = "rubricops.cli:app"

[project.urls]
Repository = "https://github.com/vipul21435/rubricops"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubricops"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "PT", "RET", "PL", "S", "TID", "PTH",
    "DTZ", "ERA",
]
ignore = [
    "PLR0913", # service and API functions legitimately take many keyword arguments
    "PLR2004", # comparisons against spec constants (scale bounds, thresholds) are clearer inline
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
# Alembic revisions keep the generated one-column-per-line layout.
"src/rubricops/db/migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: tests that take more than a second (bootstrap, large simulations)",
    "postgres: tests that need a Postgres server (RUBRICOPS_TEST_POSTGRES_URL)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["rubricops"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
